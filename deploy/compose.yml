# Продакшен GameDeck на VPS: Caddy (HTTPS) → app (Node, :3000) → postgres.
# Запуск из папки deploy: cp .env.example .env, заполнить, затем docker compose up -d --build
name: gamedeck

services:
  caddy:
    image: mirror.gcr.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      # Адрес, на котором Caddy принимает запросы. По умолчанию домен: Caddy сам получает сертификат.
      # За внешним reverse proxy с HTTPS: SITE_ADDRESS=:80, тогда здесь только http.
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:?укажите DOMAIN в .env}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # сертификаты Let's Encrypt, терять нельзя
      - caddy_config:/config
    depends_on:
      - app

  app:
    # Готовый образ из GHCR (его собирает GitHub Actions); --build соберёт локально из исходников.
    image: ${APP_IMAGE:-ghcr.io/futli/gamedeck:latest}
    build:
      context: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gamedeck:${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD в .env}@postgres:5432/gamedeck
      STARTING_COINS: ${STARTING_COINS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Вход через Telegram Mini App. Пусто — игра работает только как сайт.
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL:-}
      # Бот с виджетом «Кубик удачи»: 1 — сервер сам получает сообщения бота.
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-}
      # Виджет «Кубик удачи» в чате с ботом: 0 — не присылать, вести в Mini App.
      TELEGRAM_CHAT_WIDGET: ${TELEGRAM_CHAT_WIDGET:-1}
      # HTTP-прокси до api.telegram.org. Для контейнера xray ниже: http://xray:8118
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      WIDGET_ROLL_INTERVAL_SEC: ${WIDGET_ROLL_INTERVAL_SEC:-10800}
    # Порт наружу не открываем: в интернет смотрит только Caddy.
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: mirror.gcr.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamedeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gamedeck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamedeck -d gamedeck']
      interval: 5s
      timeout: 3s
      retries: 10

  # Прокси до Telegram для серверов в России (docs/deploy-guide.md, шаг 8).
  # Запускается только с COMPOSE_PROFILES=proxy в .env. Порт наружу не открыт:
  # к прокси может обратиться только app по сети compose.
  xray:
    image: ghcr.io/xtls/xray-core:26.10.31
    profiles: [proxy]
    restart: unless-stopped
    command: ['run', '-c', '/etc/xray/config.json']
    volumes:
      # Конфиг с ключами от x-ui создаётся на сервере и в git не попадает.
      - ./xray/config.json:/etc/xray/config.json:ro
    expose:
      - '8118'

volumes:
  caddy_data:
  caddy_config:
  pgdata:
