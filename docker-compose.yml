# PostgreSQL для GameDeck. Запуск: docker compose up -d
# Затем: DATABASE_URL=postgres://gamedeck:gamedeck@localhost:5432/gamedeck pnpm start
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamedeck
      POSTGRES_PASSWORD: gamedeck
      POSTGRES_DB: gamedeck
    ports:
      # Только localhost: базу не видно ни из Tailscale, ни из интернета.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
